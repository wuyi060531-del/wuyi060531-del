name: site-check

on:
  pull_request:
    paths: ["docs/**", "scripts/**", ".github/workflows/site-check.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "scripts/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Static site checks (relative resources, JS syntax, integrity manifest, privacy scan)
        run: python3 scripts/check_site.py
